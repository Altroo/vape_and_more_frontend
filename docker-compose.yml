# Production docker-compose configuration
# NOTE: SSL termination is handled by the shared nginx reverse proxy.
services:
  web:
    build: .
    container_name: vape_and_more_frontend_web
    restart: always
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
    extra_hosts:
      - "vape-and-more-api.elbouazzatiholding.ma:host-gateway"
      - "api.vape-and-more.ma:host-gateway"
    ports:
      - "3007:3007"
    networks:
      - webnet
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f bun || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  webnet:
    driver: bridge
